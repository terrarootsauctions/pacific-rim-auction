# Render Blueprint - web service + Postgres database, wired together.
databases:
  - name: pacific-rim-db
    databaseName: pacific_rim
    user: pacific_rim

services:
  - type: web
    name: pacific-rim-auctions
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SI_ID
        value: SI
      - key: SI_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pacific-rim-db
          property: connectionString
