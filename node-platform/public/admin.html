<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRA Admin</title>
<style>
:root{--bg:#fff;--fg:#14213d;--mut:#5a6578;--card:#f4f6fa;--line:#d5dbe6;--acc:#14213d;--onacc:#fff;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1420;--fg:#e8edf6;--mut:#9aa6bb;--card:#18202f;--line:#2b3548;--acc:#e8edf6;--onacc:#0e1420;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 12px}h2{font-size:1rem;margin:20px 0 8px;color:var(--mut);font-weight:600}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:150px;font:14px/1.4 ui-monospace,monospace}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{padding:12px 16px;min-height:44px;border:0;border-radius:10px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:600;cursor:pointer}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}button.danger{background:var(--bad);color:#fff}
pre{background:var(--card);border-radius:10px;padding:12px;overflow:auto;max-height:55vh;font-size:13px;white-space:pre-wrap;word-break:break-word}
</style></head><body><main>
<h1>Pacific Rim Auctions - SI Admin</h1>
<h2>SI token (kept in this page only, never saved)</h2>
<input id="tok" type="password" autocomplete="off" placeholder="Paste SI_TOKEN">
<h2>Status</h2>
<div class="btns"><button onclick="go('GET','/health')">Health</button><button onclick="go('GET','/api/audit/verify')">Verify audit chain</button><button onclick="go('GET','/api/permission')">Permission</button><button onclick="go('GET','/api/lots')">Lots</button></div>
<h2>Permission</h2>
<div class="btns"><button onclick="grant('EXECUTE')">Grant EXECUTE (30 days)</button><button class="alt" onclick="grant('OVERSEE')">Grant OVERSEE (30 days)</button></div>
<h2>Kill switch</h2>
<div class="btns"><button class="danger" onclick="if(confirm('Stop all live actions?'))go('POST','/api/kill',{})">KILL</button><button class="alt" onclick="go('POST','/api/unkill',{})">Unkill</button></div>
<h2>Send a request</h2>
<select id="ep"><option value="/api/check">POST /api/check (dry run - writes nothing)</option><option value="/api/lots">POST /api/lots (create lot - LIVE)</option><option value="custom">Custom path…</option></select>
<input id="cp" placeholder="/api/lots/LOT-…/bid" style="display:none;margin-top:8px">
<textarea id="body" spellcheck="false">{}</textarea>
<div class="btns"><button onclick="send()">Send</button></div>
<h2>Response</h2><pre id="out">-</pre>
<script>
const $=id=>document.getElementById(id);
$('ep').onchange=()=>{$('cp').style.display=$('ep').value==='custom'?'block':'none'};
async function go(method,path,body){
  $('out').textContent='…';
  try{
    const h={'Content-Type':'application/json'};const t=$('tok').value.trim();if(t)h.Authorization='Bearer '+t;
    const r=await fetch(path,{method,headers:h,body:method==='POST'?JSON.stringify(body||{}):undefined});
    const j=await r.json().catch(()=>({}));$('out').textContent='HTTP '+r.status+'\n'+JSON.stringify(j,null,2);
  }catch(e){$('out').textContent='Request failed: '+e.message}
}
function grant(mode){go('POST','/api/permission',{mode,actionType:'ALL',limit:null,jurisdiction:'ALL',expiresAt:new Date(Date.now()+30*864e5).toISOString()})}
function send(){let b;try{b=JSON.parse($('body').value||'{}')}catch(e){$('out').textContent='Body is not valid JSON';return}
  const p=$('ep').value==='custom'?$('cp').value.trim():$('ep').value;go('POST',p,b)}
</script></main></body></html>
